[versions]
adaptive = "1.2.0"
agp = "8.11.1"
kotlin = "2.3.20"
coreKtx = "1.18.0"
appcompat = "1.7.1"
activityCompose = "1.13.0"
composeBom = "2026.03.00"
junit = "4.13.2"
